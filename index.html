<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width", initial-scale="1.0">
    <title>For you</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Quicksand:wght@500&display=swap" rel="stylesheet">
</head>

<body>
    <div id="floating-hearts"></div>
    
    <section id="question-screen" class="screen">
        <h1>Can I tell you something?</h1>
        <div class="buttons">
            <button id="yes-btn">Yes</button>
            <button id="no-btn">No</button>
        </div>
    </section>

    <section id="love-screen" class="screen hidden">
        <div id="heart">
            <span class="love-word fade-in">I love you</span>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
